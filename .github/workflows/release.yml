# DRAFT. Not active: the only job is disabled with `if: false`, and the only trigger is a manual
# run. Review, then enable it (and register this repository and workflow as the npm trusted
# publisher for the `ant0` package) before the first release.
name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run check:forbidden
      # Beta versions go to the `next` tag, stable versions to `latest`.
      - run: npm publish --provenance --access public --tag next
